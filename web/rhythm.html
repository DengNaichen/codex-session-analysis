<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作节奏 · Luna 复核</title><style>
:root{--ink:#24382e;--muted:#68786f;--line:#dfe7dc;--accent:#32624f}*{box-sizing:border-box}body{background:#f5f5f0;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0}.shell{max-width:1220px;margin:28px auto;padding:0 24px}a{color:var(--accent)}h1{font-size:32px;margin-bottom:10px}h2{font-size:18px}p{line-height:1.75}.muted,small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:22px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;color:var(--ink)}.card strong{display:block;font-size:27px;margin:8px 0}.filters{display:flex;gap:10px;flex-wrap:wrap;background:#e9eee5;padding:15px;border-radius:12px;align-items:center}select,input,button{font:inherit}select,input{padding:9px;border:1px solid var(--line);border-radius:7px;max-width:100%}input[type=search]{flex:1;min-width:210px}article{background:white;padding:23px;border:1px solid var(--line);border-radius:12px;margin:16px 0}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.badge{display:inline-block;padding:5px 9px;background:#edf2e8;border-radius:14px;font-size:12px;margin:3px}.quote{border-left:3px solid #83a475;padding-left:12px}summary{cursor:pointer;padding:12px 0;font-weight:600}.prior{background:#f7f8f3;padding:15px;border-radius:8px}.actions{display:flex;gap:12px;align-items:center;margin:20px 0}.actions button{padding:9px 16px;background:white;border:1px solid var(--line);border-radius:7px;cursor:pointer}footer{font-size:12px;color:var(--muted);margin:28px 0;line-height:1.7}.error{color:#963e2c}@media(max-width:650px){.shell{padding:0 14px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}}
</style></head><body><main class="shell"><a href="/">← 工作节奏总览</a><h1>你的参与，发生在什么时刻？</h1><p class="muted">共同讨论 → 委托执行 → 关键决策 → 亲自验收。这里检查用户的参与记录，不把助手发消息次数当作真实打断次数。</p><div id="status">等待完整复核数据…</div><div id="content" hidden><section class="cards" id="cards"></section><div class="filters"><select id="category" aria-label="参与类型"><option value="">全部参与类型</option></select><select id="handoff" aria-label="验收路径"><option value="">全部验收路径</option><option value="actionable">可操作</option><option value="partial">部分具备</option><option value="missing">缺少路径</option><option value="unknown">证据不足</option><option value="not_applicable">不适用</option></select><select id="project" aria-label="项目"><option value="">全部项目</option></select><input id="search" type="search" placeholder="搜索你的消息、分类理由或会话主题" aria-label="搜索"><label><input id="auto" type="checkbox">包含自动化/测试</label></div><p id="count" class="muted"></p><div id="rows"></div><div class="actions"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><footer id="notes"></footer></div></main><script src="rhythm.js"></script></body></html>
