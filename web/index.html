<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Atlas · 工作模式</title><style>
:root{--bg:#f5f5f0;--card:#fff;--ink:#202c2a;--muted:#77817b;--line:#e5e9e1;--accent:#31624f;--lime:#ddea99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1480px;margin:auto;padding:30px 42px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.logo{font-weight:750;letter-spacing:-.5px;font-size:20px}.logo span{display:inline-grid;place-items:center;width:31px;height:31px;background:var(--accent);color:white;border-radius:9px;margin-right:10px}.badge{padding:7px 12px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:36px;letter-spacing:-1.5px;margin:10px 0}h2{font-size:16px;margin:0 0 5px}p{color:var(--muted);line-height:1.65}.intro{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}.intro p{margin:0}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:15px;background:#ecefe7;border-radius:13px;margin-bottom:23px}.filters input,.filters select{border:1px solid #dfe4d8;background:white;border-radius:7px;min-height:36px;padding:7px 10px;color:var(--ink)}.filters input[type=search]{flex:1;min-width:190px}.filters input[type=checkbox]{min-height:0;accent-color:var(--accent)}.check{display:flex;gap:6px;align-items:center;font-size:12px;white-space:nowrap}.reset{border:0;background:transparent;color:var(--accent);padding:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat,.panel{border:1px solid var(--line);background:var(--card);border-radius:13px}.stat{padding:22px}.stat:first-child{background:var(--accent);color:white;border-color:var(--accent)}.stat label{font-size:12px;color:var(--muted)}.stat:first-child label,.stat:first-child small{color:#cfdfd5}.stat strong{display:block;font-size:34px;letter-spacing:-1px;margin:10px 0 4px;font-weight:650}.stat small{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px}.panel{padding:24px;min-width:0}.sub{font-size:11px;color:var(--muted);margin:0 0 24px}.chart{height:156px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line);padding-top:10px}.bar{flex:1;background:#81a690;min-width:2px;border-radius:4px 4px 0 0;position:relative;min-height:0}.bar:hover{background:var(--accent)}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:10px}.ranking{display:grid;gap:15px}.rankTop{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}.rankTop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:6px;background:#edf0e9;border-radius:4px;overflow:hidden}.fill{height:100%;background:#83a48c;border-radius:4px}.empty{padding:40px 10px;color:var(--muted);text-align:center;font-size:13px}.sessions-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.session-grid{display:grid;grid-template-columns: minmax(270px,.85fr) minmax(0,1.6fr);gap:24px}.list{max-height:580px;overflow:auto;padding-right:8px}.session{display:block;text-align:left;width:100%;background:white;border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:8px;color:var(--ink)}.session:hover,.session.active{border-color:#83a48c;background:#f2f6ee}.session-title{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}.session-meta{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:10px}.detail{background:#f8f9f5;border:1px solid var(--line);border-radius:10px;min-height:320px;max-height:580px;overflow:auto;padding:22px}.detail h3{font-size:15px;margin:0 0 6px;overflow-wrap:anywhere}.detail-info{color:var(--muted);font-size:11px;line-height:1.7;overflow-wrap:anywhere;margin-bottom:20px}.message{margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--line)}.message-head{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin-bottom:8px}.role{font-weight:700;color:var(--accent)}.message-body{font-family:inherit;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7;margin:0}.foot{font-size:11px;margin:24px 0;color:var(--muted);line-height:1.7}.error{background:#fff0e8;color:#9a482a;border-radius:10px;padding:20px;margin:20px 0}.loader{font-size:14px;padding:60px;text-align:center;color:var(--muted)}@media(max-width:850px){.shell{padding:22px 18px}.brand{margin-bottom:30px}.grid,.session-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}.intro{display:block}.panel{padding:20px}.filters input[type=date]{width:140px}.list{max-height:320px}.badge{font-size:10px}.stat{padding:17px}}@media(prefers-reduced-motion:no-preference){.fill,.bar{transition:height .3s,width .3s}}
</style></head><body><main class="shell"><header class="brand"><div class="logo"><span>◈</span> Session Atlas</div><a class="badge" href="rhythm.html">协作节奏复核 →</a></header><div class="intro"><div><div class="eyebrow">YOUR WORK, IN PERSPECTIVE</div><h1>让工作模式，变得可见。</h1><p>从 Codex 会话中观察你的提问、项目与协作节奏。</p></div></div><div id="status" class="loader">正在读取本地清洗数据…</div><div id="app" hidden><section class="filters" aria-label="数据筛选"><input id="search" type="search" placeholder="搜索会话、项目或对话内容" aria-label="全文搜索"><select id="project" aria-label="项目"><option value="">所有项目</option></select><input id="from" type="date" aria-label="开始日期"><span>—</span><input id="to" type="date" aria-label="结束日期"><label class="check"><input id="children" type="checkbox">包含子 Agent</label><label class="check"><input id="human-only" type="checkbox" checked>耗时排除自动化/测试</label><button class="reset" id="reset">重置</button></section><section class="panel" id="timing-panel" style="margin-bottom:24px"></section><section class="stats" id="stats"></section><section class="grid"><article class="panel"><h2>活动随时间的变化</h2><p class="sub">每日用户消息 · 本地日期</p><div id="daily" class="chart"></div><div id="daily-axis" class="axis"></div></article><article class="panel"><h2>一天中的活跃时刻</h2><p class="sub">用户消息在本地 24 小时中的分布</p><div id="hourly" class="chart"></div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div></article></section><section class="grid"><article class="panel"><h2>你在哪里投入注意力</h2><p class="sub">项目分布 · 按筛选后的会话数</p><div id="projects" class="ranking"></div></article><article class="panel"><h2>工具使用习惯</h2><p class="sub">工具调用次数 · 不含工具返回事件</p><div id="tools" class="ranking"></div></article></section><section class="panel"><div class="sessions-header"><h2>会话档案</h2><span class="badge" id="session-count"></span></div><div class="session-grid"><div class="list" id="list"></div><div class="detail" id="detail"><div class="empty">选择会话，查看清洗后的事件与对话</div></div></div></section><footer class="foot" id="notes"></footer></div></main><script src="timing.js"></script><script>
'use strict';
const $=id=>document.getElementById(id); let data, allEvents=[], bySession=new Map(), selected='', current=[];
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x;};
const str=x=>x==null?'':String(x); const user=e=>e.role==='user' && (e.kind==='message'||e.kind==='user_message'||!e.kind||e.operation_type==='message');
const time=e=>str(e.local_timestamp||e.timestamp); const date=e=>time(e).slice(0,10); const isPrimary=s=>!s.parent_session_id&&!['subagent','sub_agent','agent','child'].includes(str(s.session_kind).toLowerCase());
const project=s=>str(s.cwd)||'未记录项目'; const shortProject=s=>s.split('/').filter(Boolean).pop()||s;
function chart(id,items){const box=$(id);box.replaceChildren();if(!items.length||!items.some(x=>x[1])){box.append(el('div','empty','暂无匹配的用户消息'));return;}const max=Math.max(...items.map(x=>x[1]),1);for(const [label,n]of items){const b=el('div','bar');b.style.height=(n/max*100)+'%';b.title=`${label}：${n} 条用户消息`;b.setAttribute('aria-label',b.title);box.append(b);}}
function rank(id,map,unit){const box=$(id);box.replaceChildren();const rows=[...map].sort((a,b)=>b[1]-a[1]).slice(0,7);if(!rows.length){box.append(el('div','empty','暂无数据'));return;}for(const [name,n]of rows){const row=el('div'),head=el('div','rankTop'),label=el('span','',name),track=el('div','track'),fill=el('div','fill');label.title=name;head.append(label,el('b','',`${n.toLocaleString()} ${unit}`));fill.style.width=n/rows[0][1]*100+'%';track.append(fill);row.append(head,track);box.append(row);}}
function count(map,key){map.set(key,(map.get(key)||0)+1);}
function render(){const q=$('search').value.trim().toLowerCase(),p=$('project').value,f=$('from').value,t=$('to').value,child=$('children').checked;current=[];for(const s of data.sessions){if(!child&&!isPrimary(s))continue;if(p&&project(s)!==p)continue;let events=bySession.get(s.session_id)||[];if(f||t){events=events.filter(e=>date(e)&&(!f||date(e)>=f)&&(!t||date(e)<=t));if(!events.length)continue;}if(q&&!([s.session_id,s.cwd,...events.map(e=>e.text)].some(v=>str(v).toLowerCase().includes(q))))continue;current.push({...s,events});}current.sort((a,b)=>str(b.events[b.events.length-1]?.timestamp).localeCompare(str(a.events[a.events.length-1]?.timestamp)));const events=current.flatMap(s=>s.events),users=events.filter(user),days=new Map(),hours=Array(24).fill(0),projects=new Map(),tools=new Map();for(const e of users){const d=date(e);if(/^\d{4}-\d{2}-\d{2}$/.test(d))count(days,d);const h=Number(time(e).slice(11,13));if(time(e).length>=13&&Number.isInteger(h)&&h>=0&&h<24)hours[h]++;}for(const s of current)count(projects,project(s));for(const e of events){if(e.name&&(e.kind==='operation'||(/call/.test(str(e.kind))&&!/output|result/.test(str(e.kind)))||['tool_call','function_call','custom_tool_call'].includes(e.operation_type)))count(tools,e.name);}const stats=[['会话',current.length,child?'包含主会话与子 Agent':'默认仅主会话'],['用户消息',users.length,'仅统计用户角色的消息'],['活跃天数',days.size,'有用户消息的本地日期'],['涉及项目',projects.size,'根据会话工作目录归组']];$('stats').replaceChildren(...stats.map(([label,n,note])=>{const node=el('article','stat');node.append(el('label','',label),el('strong','',n.toLocaleString()),el('small','',note));return node;}));let ds=[...days].sort((a,b)=>a[0].localeCompare(b[0]));if(ds.length){const start=new Date(ds[0][0]+'T00:00:00Z'),end=new Date(ds[ds.length-1][0]+'T00:00:00Z'),filled=[];for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){const key=d.toISOString().slice(0,10);filled.push([key,days.get(key)||0]);if(filled.length>10000)break;}ds=filled;}chart('daily',ds);$('daily-axis').replaceChildren(el('span','',ds[0]?.[0]||''),el('span','',ds.at(-1)?.[0]||''));chart('hourly',hours.map((n,i)=>[`${i}:00`,n]));rank('projects',projects,'会话');rank('tools',tools,'次');$('session-count').textContent=`${current.length} 个匹配会话`;$('list').replaceChildren();if(!current.length)$('list').append(el('div','empty','没有匹配会话，请调整筛选条件。'));for(const s of current){const first=s.events.find(user),btn=el('button','session'+(selected===s.session_id?' active':''));btn.append(el('div','session-title',str(first?.text).slice(0,100)||shortProject(project(s))));const meta=el('div','session-meta');meta.append(el('span','',shortProject(project(s))),el('span','',date(s.events[0]||{})||'日期未知'));btn.append(meta);btn.onclick=()=>{selected=s.session_id;document.querySelectorAll('.session.active').forEach(x=>x.classList.remove('active'));btn.classList.add('active');show(s);};$('list').append(btn);}renderTiming();const active=current.find(s=>s.session_id===selected);if(active)show(active);else{selected='';$('detail').replaceChildren(el('div','empty','选择会话，查看清洗后的事件与对话'));}}
function show(s){const box=$('detail');box.replaceChildren(el('h3','',shortProject(project(s))),el('div','detail-info',`${s.session_id}\n${project(s)} · ${s.session_kind||'未分类'} · ${s.events.length} 个筛选后事件`));const sm=(data.semantic?.sessions||[]).find(x=>x.session_id===s.session_id);if(sm){box.append(el('p','',`${sm.title} · ${sm.origin} · ${sm.confidence}`),el('p','',sm.summary),el('p','',`沟通判断：${sm.fragmentation_reason}`),el('p','',`改进建议：${sm.suggestion}`));}const messages=s.events.filter(e=>e.text||e.name||e.status);if(!messages.length)box.append(el('div','empty','此会话没有可展示的消息'));for(const e of messages){const row=el('article','message'),head=el('div','message-head');const roles={user:'你',assistant:'Codex',tool:'工具',system:'系统'};head.append(el('span','role',roles[e.role]||e.operation_type||e.kind||'事件'),el('time','',time(e).replace('T',' ').slice(0,19)));row.append(head);if(e.role==='assistant'){const timing=(data.timing?.replies||[]).find(x=>x.session_id===e.session_id&&x.source_file===e.source_file&&x.source_line===e.source_line);if(timing)row.append(el('div','detail-info',`${timing.phase==='final_answer'?'最终回复':timing.phase==='commentary'?'进度消息':'回复'} · 从本轮开始 ${durationText(timing.elapsed_from_start_ms)} · 距上一条 ${durationText(timing.gap_since_previous_reply_ms)} · 纯生成耗时未记录`));}if(e.name)row.append(el('div','detail-info',e.name+(e.status?' · '+e.status:'')));if(e.text)row.append(el('pre','message-body',e.text));else if(e.status)row.append(el('div','message-body',e.status));box.append(row);}box.scrollTop=0;}
async function init(){try{const res=await fetch('./data.json',{cache:'no-store'});if(!res.ok)throw Error(`HTTP ${res.status}`);data=await res.json();if(!Array.isArray(data.sessions)||!Array.isArray(data.events))throw Error('数据格式不正确：缺少 sessions 或 events 数组');allEvents=data.events;for(const e of allEvents){if(!bySession.has(e.session_id))bySession.set(e.session_id,[]);bySession.get(e.session_id).push(e);}const groups=[...new Set(data.sessions.map(project))].sort();for(const p of groups){const opt=el('option','',shortProject(p));opt.value=p;opt.title=p;$('project').append(opt);}for(const id of ['search','project','from','to','children','human-only'])$(id).addEventListener(id==='search'?'input':'change',render);$('reset').onclick=()=>{for(const id of ['search','project','from','to'])$(id).value='';$('children').checked=false;$('human-only').checked=true;render();};const limitations=data.report?.limitations;const extra=Array.isArray(limitations)?limitations.join('；'):typeof limitations==='string'?limitations:'';$('notes').textContent='口径说明：时间图展示事件发生时间，不代表工时或持续专注时间。全文搜索匹配会话后保留该会话在日期范围内的事件。主会话依据 session_kind 与父会话标记识别。数据来自本地清洗结果，原始 session 文件保持不变。'+(extra?' 数据限制：'+extra:'');$('status').hidden=true;$('app').hidden=false;render();}catch(err){$('status').className='error';$('status').textContent='无法加载清洗数据：'+err.message+'。请先生成 web/data.json，并通过项目提供的本地服务器打开此页面。';}}init();
</script></body></html>
