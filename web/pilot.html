<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna 工作节奏分类试验</title><style>body{font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f0;color:#20372c;max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:28px}p{line-height:1.7}select{padding:9px;margin:8px;border:1px solid #ddd;border-radius:8px}article{background:white;padding:24px;border-radius:12px;margin:18px 0;border:1px solid #e2e8df}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font:inherit}small{color:#627569}.tags{font-size:13px;color:#39745b}a{color:#39745b}summary{cursor:pointer;padding:12px 0}.quote{border-left:3px solid #a7bb86;padding-left:14px}button{padding:8px;cursor:pointer}</style><body><a href="/">← 工作节奏总览</a><h1>Luna · 100 条消息分类试验</h1><p>判断哪些消息值得立即关注，哪些可以集中汇报。来自46个会话的分层样本，不代表总体比例；标签尚未由你校准，不等于实际打断或浪费工时。</p><div id="stats">正在加载…</div><label>筛选 <select id="filter"><option value="all">全部</option><option value="batch">可汇总且无需回复</option><option value="blocking">要求回复才能继续</option><option value="redundant">可能重复确认</option><option value="uncertain">存在不确定判断</option></select></label><div id="rows"></div><script>
const make=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;};let data;
const names={discussion:'讨论',execution:'执行',acceptance:'验收',unknown:'未知',delivery:'交付',decision:'决策',coordination:'流程协调',progress:'进度',correction:'纠偏',none:'无需回复',later:'可稍后回复',blocking:'等待回复',necessary:'必要',redundant:'可能重复',not_applicable:'不适用',yes:'可以汇总',no:'不宜汇总',high:'高',medium:'中',low:'低'};
function render(){const filter=document.getElementById('filter').value;const rows=data.items.filter(x=>filter==='all'||filter==='batch'&&x.label.can_batch==='yes'&&x.label.response_requirement==='none'||filter==='blocking'&&x.label.response_requirement==='blocking'||filter==='redundant'&&x.label.necessity==='redundant'||filter==='uncertain'&&(x.label.confidence==='low'||[x.label.stage,x.label.response_requirement,x.label.necessity,x.label.can_batch].includes('unknown')));const box=document.getElementById('rows');box.replaceChildren();document.getElementById('stats').textContent=`模型 ${data.summary.model} · ${data.summary.samples} 条 · 当前显示 ${rows.length} 条 · 规则 v1`;for(const item of rows){const s=item.sample,r=item.label,a=make('article');a.append(make('h3',`消息 ${s.event_id} · ${names[r.stage]}`),make('p',`${r.functions.map(x=>names[x]).join(' / ')} ｜ ${names[r.response_requirement]} ｜ 必要性：${names[r.necessity]} ｜ ${names[r.can_batch]} ｜ 置信度 ${names[r.confidence]}`,'tags'),make('pre',s.target.text),make('p',r.reason),make('p','原文依据：'+r.evidence,'quote'));if(r.prior_evidence)a.append(make('p','前文依据：'+r.prior_evidence,'quote'));const d=make('details');d.append(make('summary','展开此前对话与需求（输入可能截断）'));d.append(make('pre','最初需求：'+s.task_opening.text));for(const p of s.prior_messages)d.append(make('pre',p.role+'：'+p.text+(p.truncated?'\n[截断]':'')));a.append(d,make('small',s.source_file+':'+s.source_line));box.append(a);}}
fetch('./pilot.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('结果尚未生成');return r.json();}).then(x=>{data=x;render();}).catch(e=>document.getElementById('stats').textContent=e.message);document.getElementById('filter').onchange=render;
</script></body></html>
